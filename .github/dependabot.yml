version: 2
updates:
  - package-ecosystem: npm
    directory: /app
    schedule:
      interval: weekly
    ignore:
      # PrimeVue 5+ / PrimeIcons 8+ / themes 3+ moved to a commercial license; stay on the MIT releases
      - dependency-name: primevue
        update-types: [version-update:semver-major]
      - dependency-name: "@primevue/*"
        update-types: [version-update:semver-major]
      - dependency-name: primeicons
        update-types: [version-update:semver-major]
      - dependency-name: "@primeuix/themes"
        update-types: [version-update:semver-major]
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directories: [/app, /api, /db]
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
